<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#040C28">
  <title>QueueBar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: #000; font-family: 'Space Grotesk', system-ui, sans-serif; color: #fff; }
    body { display: flex; justify-content: center; }

    #app { position: relative; width: 390px; max-width: 100%; height: 100vh; overflow: hidden; background: #000; }

    .screen { position: absolute; inset: 0; display: none; flex-direction: column; padding: 16px 16px 100px; overflow-y: auto; }
    .screen.active { display: flex; }
    .screen h1 { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.5px; margin-bottom: 16px; }
    .placeholder { margin: auto; color: rgba(255,255,255,0.6); font-size: 14px; text-align: center; }

    #screen-home    { background: linear-gradient(180deg, #C4D8F8, #4878C8, #040C28); }
    #screen-explore { background: linear-gradient(180deg, #D4C4F8, #7848C8, #0D0428); }
    #screen-live    { background: linear-gradient(180deg, #B8F0D0, #28A060, #021008); }
    #screen-report  { background: linear-gradient(180deg, #FFF0B8, #D09010, #180C00); }
    #screen-profile { background: linear-gradient(180deg, #F8C8C8, #C84040, #180404); }

    #bottom-nav {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 10;
      display: flex; height: calc(60px + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: transparent;
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    }
    .tab {
      flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      background: none; border: 0; cursor: pointer; font: inherit; font-size: 10px; font-weight: 500;
      color: rgba(255,255,255,0.4);
    }
    .tab.active { color: #fff; }
    .tab svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tab .icon { position: relative; display: flex; }
    .live-dot { position: absolute; top: -1px; right: -3px; width: 8px; height: 8px; border-radius: 50%; background: #E8001C; }
  </style>
</head>
<body>
  <div id="app">
    <section id="screen-home" class="screen active">
      <h1>QueueBar</h1>
      <p class="placeholder">🗺️ Karta</p>
    </section>

    <section id="screen-explore" class="screen">
      <h1>Utforska</h1>
      <p class="placeholder">Sök och filtrera barer och klubbar</p>
    </section>

    <section id="screen-live" class="screen">
      <h1>Live</h1>
      <p class="placeholder">Inga rapporter ännu. Gå ut och rapportera!</p>
    </section>

    <section id="screen-report" class="screen">
      <h1>Rapportera</h1>
      <p class="placeholder">Rapportera köläget på ditt ställe</p>
    </section>

    <section id="screen-profile" class="screen">
      <h1>Profil</h1>
      <p class="placeholder">Anonym Användare</p>
    </section>

    <nav id="bottom-nav">
      <button class="tab active" data-screen="home" onclick="showScreen('home')">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><line x1="9" y1="4" x2="9" y2="20"/><line x1="15" y1="6" x2="15" y2="22"/></svg></span>
        Karta
      </button>
      <button class="tab" data-screen="explore" onclick="showScreen('explore')">
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><line x1="16" y1="16" x2="21" y2="21"/></svg></span>
        Utforska
      </button>
      <button class="tab" data-screen="live" onclick="showScreen('live')">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0"/><path d="M5 12.5a10.5 10.5 0 0 1 14 0"/><path d="M8.5 16a5.5 5.5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1" fill="currentColor"/></svg><span class="live-dot"></span></span>
        Live
      </button>
      <button class="tab" data-screen="report" onclick="showScreen('report')">
        <span class="icon"><svg viewBox="0 0 24 24"><path d="M3 10v4h3l8 4V6L6 10z"/><path d="M17.5 9.5a4 4 0 0 1 0 5"/><path d="M6 14l1.5 5h2.5l-1.2-4.5"/></svg></span>
        Rapportera
      </button>
      <button class="tab" data-screen="profile" onclick="showScreen('profile')">
        <span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg></span>
        Profil
      </button>
    </nav>
  </div>

  <script>
    function showScreen(name) {
      document.querySelectorAll('.screen').forEach(function (el) {
        el.classList.toggle('active', el.id === 'screen-' + name);
      });
      document.querySelectorAll('.tab').forEach(function (el) {
        el.classList.toggle('active', el.dataset.screen === name);
      });
    }
  </script>
</body>
</html>
